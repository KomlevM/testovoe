<div class="filter-panel">

    <!-- Статус -->
    <mat-form-field appearance="outline" class="filter-panel__field">
        <mat-label>Статус</mat-label>
        <mat-select multiple>
            <mat-option></mat-option>
        </mat-select>
    </mat-form-field>

    <!-- Приоритет -->
    <mat-form-field appearance="outline" class="filter-panel__field">
        <mat-label>Приоритет</mat-label>
        <mat-select multiple>
            <mat-option></mat-option>
        </mat-select>
    </mat-form-field>

    <!-- Проект -->
    <mat-form-field appearance="outline" class="filter-panel__field">
        <mat-label>Проект</mat-label>
        <mat-select multiple>
            <mat-option ></mat-option>
        </mat-select>
    </mat-form-field>

    <!-- Исполнитель (+ "Без исполнителя") -->
    <mat-form-field appearance="outline" class="filter-panel__field">
        <mat-label>Исполнитель</mat-label>
        <mat-select multiple>
            <mat-option value="__none__">— Без исполнителя —</mat-option>
            <mat-option ></mat-option>
        </mat-select>
    </mat-form-field>

    <!-- Теги -->
    <mat-form-field appearance="outline" class="filter-panel__field">
        <mat-label>Теги</mat-label>
        <mat-select multiple>
            <mat-option></mat-option>
        </mat-select>
    </mat-form-field>

    <!-- Архив -->
    <mat-checkbox class="filter-panel__archive">
        Показывать архив
    </mat-checkbox>

    <!-- N дней для "скоро истекает" -->
    <mat-form-field appearance="outline" class="filter-panel__field filter-panel__field--narrow">
        <mat-label>Скоро истекает, дней</mat-label>
        <input matInput type="number" min="1" step="1">
    </mat-form-field>

    <!-- Сброс -->
    <button mat-stroked-button type="button" class="filter-panel__reset">
        Сбросить
    </button>

</div>
