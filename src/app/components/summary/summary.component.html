@if (summary$ | async; as res) {
@if (filters$ | async; as filters) {

<div class="summary">
    <div class="summary__controls">
        <label class="summary__soon-field">
            <span>Скоро, дней</span>
            <input matInput type="number" min="0" step="1" [formControl]="soonDaysControl" class="summary__soon-input">
        </label>
    </div>

    <!-- Radio-ряд metric-плиток: активна максимум одна -->
    <div class="summary__tiles">
        @for (t of metricTiles; track t.key) {
        <button mat-stroked-button class="summary__tile" [class]="'summary__tile--' + t.type"
            [class.summary__tile--active]="isActive(filters, t.key)" [attr.aria-pressed]="isActive(filters, t.key)"
            (click)="onMetricClick(filters, t.key)">
            <span class="summary__tile-inner">
                <mat-icon class="summary__tile-icon" aria-hidden="true">{{ t.icon }}</mat-icon>
                <span class="summary__tile-label">
                    <span class="summary__tile-label-text">{{ t.label }}</span>
                </span>
                <span class="summary__tile-value">{{ metricValue(res, t) }}</span>
            </span>
        </button>
        }
    </div>
</div>
}
}
