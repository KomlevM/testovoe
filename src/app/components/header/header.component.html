<div class="container">
    <mat-toolbar class="header-toolbar">
        <div class="status-container">
            @if (freshness$ | async; as st) {
            <span class="status-badge" [class]="'status-badge--' + st.level"
                [title]="st.ageSeconds != null ? ('последний успешный ответ ' + st.ageSeconds + ' c назад') : 'успешных ответов ещё не было'">
                <span class="status-badge__dot"></span>
                {{ st.label }}
            </span>
            }
            @if (rateLimit$ | async; as rl) {
            <span class="status-badge" [class.status-badge--down]="rl.limited"
                [class.status-badge--stale]="!rl.limited && rl.remaining != null && rl.remaining <= 1"
                [class.status-badge--fresh]="!rl.limited && rl.remaining != null && rl.remaining > 1" style="margin-left: 5px">
                @if (rl.limited) {
                лимит исчерпан@if (rl.limit != null) { · 0/{{ rl.limit }} }
                } @else if (rl.limit != null && rl.remaining != null) {
                запросы · {{ rl.remaining }}/{{ rl.limit }}
                }
            </span>
            }
        </div>
        <div class="buttons-container">
            <button mat-stroked-button type="button" aria-label="Обновить" (click)="reload()">
                Обновить
            </button>
            <button mat-stroked-button type="button" color="primary" [disabled]="!(canExport$ | async)"
                (click)="exportJson()">
                Экспорт JSON
            </button>
            <button mat-stroked-button type="button" (click)="openMetrics()">
                Метрики
            </button>
        </div>
    </mat-toolbar>
</div>
