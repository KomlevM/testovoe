<footer class="app-footer">
  @if (pulse$ | async; as p) {
    @switch (p.status) {
      @case ('loading') {
        <span class="footer__item">heartbeat: загрузка…</span>
      }
      @case ('ok') {
        <span class="footer__item">
          {{ p.data?.service }}: <strong>ok</strong>
        </span>
        <span class="footer__item">v{{ p.data?.version }}</span>
        <span class="footer__item">UTC: {{ p.data?.utc_time }}</span>
        <span class="footer__item footer__token">
          token: <code>{{ p.data?.heartbeat }}</code>
        </span>
      }
      @case ('error') {
        <span class="footer__item footer__item--error">
          heartbeat: недоступен
        </span>
      }
    }
  }
</footer>
